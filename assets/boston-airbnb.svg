<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260">
  <defs>
    <filter id="glowD" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="440" height="260" fill="#0d1117"/>

  <!-- source nodes -->
  <circle cx="110" cy="45" r="26" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="110" y="42" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#e6edf3">listings</text>
  <text x="110" y="54" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#8b949e">4,608</text>

  <circle cx="330" cy="45" r="26" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="330" y="42" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9.5" fill="#e6edf3">calendar</text>
  <text x="330" y="54" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="8.6" fill="#8b949e">1.68M</text>

  <!-- converging arrows -->
  <path d="M124,62 L210,88" stroke="#39d6ff" stroke-width="2" fill="none" filter="url(#glowD)" stroke-dasharray="108">
    <animate attributeName="stroke-dashoffset" values="108;108;0;0;108" keyTimes="0;0.03;0.16;0.9;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M316,62 L230,88" stroke="#39d6ff" stroke-width="2" fill="none" filter="url(#glowD)" stroke-dasharray="108">
    <animate attributeName="stroke-dashoffset" values="108;108;0;0;108" keyTimes="0;0.03;0.16;0.9;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- merge node -->
  <circle cx="220" cy="98" r="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="220" cy="98" r="20" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glowD)">
    <animate attributeName="opacity" values="0.15;0.15;1;1;0.15" keyTimes="0;0.15;0.18;0.9;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="220" y="102" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#e6edf3">join</text>
  <text x="220" y="130" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">on listing_id</text>

  <!-- correlation heatmap -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.24;0.75;0.80;1" dur="6s" repeatCount="indefinite"/>
    <!-- 4x4 grid, diagonal = self-correlation -->
    <g font-family="ui-monospace,Consolas,monospace">
      <rect x="150" y="145" width="24" height="24" fill="#39d6ff" opacity="1"/>
      <rect x="176" y="145" width="24" height="24" fill="#39d6ff" opacity="0.55"/>
      <rect x="202" y="145" width="24" height="24" fill="#39d6ff" opacity="0.2"/>
      <rect x="228" y="145" width="24" height="24" fill="#39d6ff" opacity="0.4"/>

      <rect x="150" y="171" width="24" height="24" fill="#39d6ff" opacity="0.55"/>
      <rect x="176" y="171" width="24" height="24" fill="#39d6ff" opacity="1"/>
      <rect x="202" y="171" width="24" height="24" fill="#39d6ff" opacity="0.3"/>
      <rect x="228" y="171" width="24" height="24" fill="#39d6ff" opacity="0.15"/>

      <rect x="150" y="197" width="24" height="24" fill="#39d6ff" opacity="0.2"/>
      <rect x="176" y="197" width="24" height="24" fill="#39d6ff" opacity="0.3"/>
      <rect x="202" y="197" width="24" height="24" fill="#39d6ff" opacity="1"/>
      <rect x="228" y="197" width="24" height="24" fill="#39d6ff" opacity="0.65"/>

      <rect x="150" y="223" width="24" height="24" fill="#39d6ff" opacity="0.4"/>
      <rect x="176" y="223" width="24" height="24" fill="#39d6ff" opacity="0.15"/>
      <rect x="202" y="223" width="24" height="24" fill="#39d6ff" opacity="0.65"/>
      <rect x="228" y="223" width="24" height="24" fill="#39d6ff" opacity="1"/>
    </g>
    <text x="115" y="160" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#8b949e">price</text>
    <text x="115" y="186" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#8b949e">avail</text>
    <text x="115" y="212" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#8b949e">reviews</text>
    <text x="115" y="238" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#8b949e">room type</text>
  </g>

  <!-- final readout -->
  <g font-family="ui-monospace,Consolas,monospace" text-anchor="middle">
    <text x="335" y="185" font-size="11.5" fill="#e6edf3">
      4,608 × 1.68M rows merged
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.60;0.90;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="335" y="203" font-size="11" fill="#8b949e">
      Pearson correlation, IQR outliers
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.60;0.90;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="335" y="223" font-size="12" fill="#3fb950" font-weight="600">
      ✓ EDA verified
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.65;0.90;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
