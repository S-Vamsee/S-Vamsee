<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 36" width="230" height="36">
  <defs>
    <filter id="glowDot" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="229" height="35" rx="18" fill="#161b22" stroke="#30363d"/>
  <circle cx="20" cy="18" r="5" fill="#3fb950" filter="url(#glowDot)">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="34" y="23" font-family="ui-monospace,Consolas,monospace" font-size="12.5" font-weight="600"
    letter-spacing="0.5" fill="#e6edf3">SYSTEMS ONLINE</text>
</svg>
