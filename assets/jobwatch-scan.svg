<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" width="300" height="330">
  <defs>
    <filter id="glow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="300" height="330" fill="#0d1117"/>

  <!-- orbit ring -->
  <circle cx="150" cy="150" r="100" fill="none" stroke="#21262d" stroke-width="1.5"/>

  <!-- sweep -->
  <g>
    <line x1="150" y1="150" x2="150" y2="50" stroke="#39d6ff" stroke-width="2" filter="url(#glow2)"/>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      from="-90 150 150" to="270 150 150" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- center bot core -->
  <circle cx="150" cy="150" r="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="150" y="154" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#8b949e">bot</text>

  <!-- source nodes -->
  <g>
    <circle cx="150" cy="50" r="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="150" cy="50" r="20" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glow2)">
      <animate attributeName="opacity" values="1;1;0.15;0.15" keyTimes="0;0.05;0.07;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="150" y="35" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">Greenhouse</text>
  </g>

  <g>
    <circle cx="245.1" cy="119.1" r="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="245.1" cy="119.1" r="20" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glow2)">
      <animate attributeName="opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.15;0.17;0.23;0.25;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="270" y="105" text-anchor="start" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">Lever</text>
  </g>

  <g>
    <circle cx="208.8" cy="230.9" r="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="208.8" cy="230.9" r="20" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glow2)">
      <animate attributeName="opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.35;0.37;0.43;0.45;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="230" y="255" text-anchor="start" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">Ashby</text>
  </g>

  <g>
    <circle cx="91.2" cy="230.9" r="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="91.2" cy="230.9" r="20" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glow2)">
      <animate attributeName="opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.55;0.57;0.63;0.65;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="255" text-anchor="end" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">SmartRecruiters</text>
  </g>

  <g>
    <circle cx="54.9" cy="119.1" r="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="54.9" cy="119.1" r="20" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glow2)">
      <animate attributeName="opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.75;0.77;0.83;0.85;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="105" text-anchor="end" font-family="-apple-system,Segoe UI,sans-serif" font-size="10" fill="#8b949e">Amazon Jobs</text>
  </g>

  <!-- digest sent -->
  <text x="150" y="300" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#3fb950" font-weight="600">
    ✉ digest sent
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.90;0.93;0.99;1" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
