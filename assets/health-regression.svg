<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="420" height="230">
  <defs>
    <filter id="glow3" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="420" height="230" fill="#0d1117"/>

  <!-- axes -->
  <line x1="40" y1="20" x2="40" y2="185" stroke="#30363d" stroke-width="1.5"/>
  <line x1="40" y1="185" x2="390" y2="185" stroke="#30363d" stroke-width="1.5"/>
  <text x="10" y="24" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#8b949e">premium</text>
  <text x="360" y="205" font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#8b949e">age/bmi</text>

  <!-- scatter (illustrative, not literal data points) -->
  <g fill="#8b949e" opacity="0.7">
    <circle cx="70" cy="160" r="3.5"/>
    <circle cx="95" cy="150" r="3.5"/>
    <circle cx="110" cy="168" r="3.5"/>
    <circle cx="130" cy="140" r="3.5"/>
    <circle cx="150" cy="130" r="3.5"/>
    <circle cx="165" cy="150" r="3.5"/>
    <circle cx="185" cy="115" r="3.5"/>
    <circle cx="205" cy="128" r="3.5"/>
    <circle cx="225" cy="100" r="3.5"/>
    <circle cx="245" cy="112" r="3.5"/>
    <circle cx="265" cy="85" r="3.5"/>
    <circle cx="285" cy="95" r="3.5"/>
    <circle cx="305" cy="70" r="3.5"/>
    <circle cx="330" cy="60" r="3.5"/>
    <circle cx="355" cy="45" r="3.5"/>
  </g>

  <!-- regression line draws in -->
  <path d="M55,172 L370,42" stroke="#39d6ff" stroke-width="2.5" fill="none" filter="url(#glow3)"
    stroke-dasharray="364" >
    <animate attributeName="stroke-dashoffset" values="364;364;0;0;364" keyTimes="0;0.05;0.5;0.85;1" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- metric readout -->
  <g font-family="ui-monospace,Consolas,monospace">
    <text x="230" y="35" font-size="14" fill="#3fb950" font-weight="600">
      R² ≈ 0.85
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.55;0.85;0.9;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="230" y="52" font-size="11" fill="#8b949e">
      5-fold CV · XGBoost
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.55;0.85;0.9;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
