<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="190" fill="#0d1117"/>

  <!-- connecting line -->
  <path d="M80,95 L260,95 L440,95 L620,95 L800,95" stroke="#30363d" stroke-width="2" fill="none"/>

  <!-- traveling signal -->
  <circle r="7" fill="#39d6ff" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite"
      keyPoints="0;0;0.25;0.25;0.5;0.5;0.75;0.75;1;1"
      keyTimes="0;0.20;0.20;0.40;0.40;0.60;0.60;0.80;0.80;1"
      calcMode="linear"
      path="M80,95 L260,95 L440,95 L620,95 L800,95"/>
  </circle>

  <!-- node 1: INGEST -->
  <g>
    <circle cx="80" cy="95" r="24" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="80" cy="95" r="24" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;0.15;0.15" keyTimes="0;0.18;0.20;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="100" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#e6edf3">IN</text>
  </g>
  <text x="80" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8b949e">INGEST</text>

  <!-- node 2: CLASSIFY -->
  <g>
    <circle cx="260" cy="95" r="24" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="260" cy="95" r="24" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.18;0.20;0.38;0.40;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="260" y="100" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#e6edf3">CL</text>
  </g>
  <text x="260" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8b949e">CLASSIFY</text>

  <!-- node 3: P&amp;L -->
  <g>
    <circle cx="440" cy="95" r="24" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="440" cy="95" r="24" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.38;0.40;0.58;0.60;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="440" y="100" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#e6edf3">PL</text>
  </g>
  <text x="440" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8b949e">P&amp;L</text>

  <!-- node 4: SYNC -->
  <g>
    <circle cx="620" cy="95" r="24" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="620" cy="95" r="24" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.58;0.60;0.78;0.80;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="620" y="100" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#e6edf3">SY</text>
  </g>
  <text x="620" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8b949e">SYNC</text>

  <!-- node 5: RECONCILE -->
  <g>
    <circle cx="800" cy="95" r="24" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <circle cx="800" cy="95" r="24" fill="none" stroke="#3fb950" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.15;0.15;1;1" keyTimes="0;0.78;0.80;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="800" y="100" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#e6edf3">RC</text>
  </g>
  <text x="800" y="140" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#8b949e">RECONCILE</text>

  <!-- result flash -->
  <text x="800" y="165" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#3fb950" font-weight="600">
    ✓ $0.00
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.86;0.99;1" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
