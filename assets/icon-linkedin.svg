<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glowL" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="26" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#39d6ff" stroke-width="1.5" filter="url(#glowL)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="32" y="38" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-weight="700" font-size="17" fill="#e6edf3">in</text>
</svg>
